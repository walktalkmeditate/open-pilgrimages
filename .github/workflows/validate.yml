name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'routes/**'
      - 'schema/**'
      - 'index.json'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'routes/**'
      - 'schema/**'
      - 'index.json'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Build index
        # shell: bash sets -o pipefail. Without it the default `bash -e` takes
        # tee's exit code, so a failing generator would pass this step.
        shell: bash
        run: npm run build-index | tee /tmp/build-index.log
      - name: Assert the generator actually ran
        run: grep -q "Generated index.json" /tmp/build-index.log
      - name: Check index.json is up to date
        run: git diff --exit-code index.json
      - run: npm run validate
