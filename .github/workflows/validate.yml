name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'routes/**'
      - 'schema/**'
      - 'index.json'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'routes/**'
      - 'schema/**'
      - 'index.json'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The drafted-text step below needs a real merge base with the base
          # branch, not just this branch's own history — actions/checkout's
          # default shallow (depth-1) clone has neither.
          fetch-depth: 0
          # HEAD must be the PR's own head commit, not the default ref.
          #
          # On a pull_request event actions/checkout defaults to github.sha,
          # which is the ephemeral test-merge commit GitHub builds by merging
          # the PR head into the base branch's current tip. That commit has
          # the base tip as a direct parent, so `git merge-base HEAD <base
          # tip>` collapses to the base tip itself — the exact ref the buggy
          # version passed, and the fork point is never found. Pinning the
          # checkout to the head SHA is what makes the merge-base below
          # anything other than a no-op. Do not "simplify" this away.
          #
          # An empty ref means "not provided" to actions/checkout, which then
          # falls back to github.context.ref/sha — so on a push to main or a
          # workflow_dispatch, where github.event.pull_request is absent and
          # this expression renders as the empty string, the checkout is
          # unchanged (and the drafted-text step does not run at all).
          #
          # The pin costs something, deliberately: every step below now
          # proves the PR head is self-consistent rather than that the merge
          # result is. Two content PRs whose index.json merges cleanly but
          # wrongly would surface on main's push run instead of on either
          # PR. That is the price of a gate that reads the working tree —
          # check-drafted-diff and the review checklist both do — because
          # against a merged tree a concurrent PR's ticked line would
          # satisfy this PR's cleared flag. Requiring branches to be up to
          # date before merging closes the gap from the other side.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Build ways
        run: npm run build-ways
      - name: Build index
        # shell: bash sets -o pipefail. Without it the default `bash -e` takes
        # tee's exit code, so a failing generator would pass this step.
        shell: bash
        run: npm run build-index | tee /tmp/build-index.log
      - name: Assert the generator actually ran
        run: grep -q "Generated index.json" /tmp/build-index.log
      - name: Check index.json is up to date
        run: git diff --exit-code index.json
      - run: npm run validate
      - name: No drafted text cleared without a review
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Diffing against the base branch's current tip (the old FETCH_HEAD
        # arg) blames this PR for any drafted:true flag that landed on the
        # base branch after this branch forked — a concurrent content PR
        # merging first is exactly this repo's situation once two content
        # PRs are in flight. The merge base is the tree this PR's changes
        # actually diverged from, so it's the only ref a same-PR diff can be
        # measured against without picking up someone else's commits.
        #
        # This only holds because the checkout above pins HEAD to the PR head.
        # Against the default checkout HEAD is the test-merge commit, whose
        # parent is the base tip, and the merge base degenerates back to that
        # tip. The explicit fetch is still needed either way: checkout fetches
        # the head SHA with no destination refspec, so there is no
        # refs/remotes/origin/<base> to name — FETCH_HEAD is the base tip.
        run: |
          git fetch --no-tags origin "$BASE_REF"
          MERGE_BASE="$(git merge-base HEAD FETCH_HEAD)"
          npm run check-drafted-diff -- "$MERGE_BASE"
      - run: npm run build-assets
      - name: Check generated assets are up to date
        # git diff --exit-code alone misses brand-new files (e.g. the first
        # sparkline generated for a route that just gained a stats.json, or
        # the first route.gpx for a brand-new route) — untracked-files=all
        # makes those show up as drift too. routes is included alongside
        # docs because build-assets also writes route.gpx beside each
        # route's other data. The scope is all of docs, not docs/assets:
        # build-assets also writes docs/<pilgrimage-id>.html, which is a
        # published page, so a page never generated locally (or left stale
        # by a renamed section) has to count as drift too.
        #
        # The three rebuild commands are named one by one rather than as
        # `npm run pipeline`, which now starts with `fetch`: a contributor
        # whose Overpass call is rate-limited would abort before build-ways
        # and never reach the rebuild this message is asking for. The steps
        # above run the same three individually for the same reason.
        run: |
          changes="$(git status --porcelain --untracked-files=all docs routes)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "docs or routes is out of date — run npm run build-assets and commit the result."
            echo "If the routes/*/ways/ drift, that comes from build-ways, not build-assets — run npm run build-ways, npm run build-index and npm run validate instead."
            exit 1
          fi
      - run: npm run check-site
