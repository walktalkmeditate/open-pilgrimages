name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'routes/**'
      - 'schema/**'
      - 'index.json'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'routes/**'
      - 'schema/**'
      - 'index.json'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Build ways
        run: npm run build-ways
      - name: Build index
        # shell: bash sets -o pipefail. Without it the default `bash -e` takes
        # tee's exit code, so a failing generator would pass this step.
        shell: bash
        run: npm run build-index | tee /tmp/build-index.log
      - name: Assert the generator actually ran
        run: grep -q "Generated index.json" /tmp/build-index.log
      - name: Check index.json is up to date
        run: git diff --exit-code index.json
      - run: npm run validate
      - name: No drafted text cleared without a review
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          npm run check-drafted-diff -- FETCH_HEAD
      - run: npm run build-assets
      - name: Check generated assets are up to date
        # git diff --exit-code alone misses brand-new files (e.g. the first
        # sparkline generated for a route that just gained a stats.json, or
        # the first route.gpx for a brand-new route) — untracked-files=all
        # makes those show up as drift too. routes is included alongside
        # docs because build-assets also writes route.gpx beside each
        # route's other data. The scope is all of docs, not docs/assets:
        # build-assets also writes docs/<pilgrimage-id>.html, which is a
        # published page, so a page never generated locally (or left stale
        # by a renamed section) has to count as drift too.
        run: |
          changes="$(git status --porcelain --untracked-files=all docs routes)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "docs or routes is out of date — run npm run build-assets and commit the result."
            echo "If the routes/*/ways/ drift, that comes from build-ways, not build-assets — run npm run pipeline (build-ways + build-index + validate) instead."
            exit 1
          fi
      - run: npm run check-site
